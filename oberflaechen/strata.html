<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Strata</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 13 von 22 · STRATA */
  :root{--ac:#ff5fa2;--ac-rgb:255,95,162;--bg:#0c0308}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">strata · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Strata";
    J.on("state", s => { $("thState").textContent = "strata · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  let cx = 0, cy = 0, R = 200, rot = 0;
  const LAYERS = 11, PER = 46;
  J.registerTheme({
    id: "strata", maus: "abstossen",
    init(J) { cap(J); },
    resize(w, h) { cx = w / 2; cy = h * 0.48; R = Math.min(w * 0.25, h * 0.27); J.orbit = { x: cx, y: cy, r: R }; },
    draw(ctx, w, h, S) {
      const t = S.t, sp = J.sprite;
      rot += S.dt * (0.2 + S.think * 1.3 + S.speak * 0.3);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#2a0a1c"); bg.addColorStop(0.5, "#12040d"); bg.addColorStop(1, "#060205");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.pulse * 0.05), F = 3.4, tilt = 0.5, ct = Math.cos(tilt), st = Math.sin(tilt);
      J.glowAt(ctx, sp(255, 60, 140), cx, cy, br * 3.4, 0.26 + S.level * 0.22);
      const core = br * (0.22 + S.level * 0.3 + S.pulse * 0.1);
      J.glowAt(ctx, sp(255, 130, 185), cx, cy, core * 3.6, 0.7); J.glowAt(ctx, sp(255, 245, 250, true), cx, cy, core * 1.2, 1);
      const s1 = sp(255, 120, 180, true), s2 = sp(255, 235, 245, true);
      const P = (ang, rad, y0) => { const x0 = Math.cos(ang) * rad, z0 = Math.sin(ang) * rad, y = y0 * ct - z0 * st, z = y0 * st + z0 * ct, k = F / (F + z); return [cx + x0 * br * k, cy + y * br * k, z, k]; };
      const cols = [];
      for (let L = 0; L < LAYERS; L++) {
        const v = L / (LAYERS - 1) * 2 - 1, eq = S.level * (0.5 + 0.5 * Math.sin(L * 1.7 - t * 9)) + S.mic * 0.5 * (0.5 + 0.5 * Math.sin(L * 2.3 + t * 6));
        const y0 = v * 1.02 + 0.03 * Math.sin(t * 0.8 + L), rad = Math.sqrt(Math.max(0.03, 1 - v * v)) * (1 + eq * 0.3) + 0.06, dir = L % 2 ? -1 : 1, a0 = rot * dir * (0.6 + 0.4 * Math.abs(v));
        ctx.beginPath(); const row = [];
        for (let i = 0; i <= PER; i++) { const p = P(a0 + i / PER * TAU, rad, y0); row.push(p); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
        ctx.strokeStyle = `rgba(255,110,170,${0.14 + eq * 0.5})`; ctx.lineWidth = 1; ctx.stroke();
        for (let i = 0; i < PER; i++) { const p = row[i], front = p[2] < 0; J.glowAt(ctx, (i + L) % 7 ? s1 : s2, p[0], p[1], (front ? 5.5 : 3) * p[3] * (1 + eq * 1.6), front ? 0.8 : 0.28); }
        cols.push(row);
      }
      ctx.lineWidth = 1;   // senkrechte Verbindungen (Säulen)
      for (let i = 0; i < PER; i += 2) for (let L = 0; L < LAYERS - 1; L++) {
        const a = cols[L][i], b = cols[L + 1][(i + (L % 2 ? 1 : 0)) % PER]; if (a[2] > 0.35 && b[2] > 0.35) continue;
        ctx.strokeStyle = `rgba(255,150,195,${0.05 + S.level * 0.12})`; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      if (S.listen > 0.3) J.glowAt(ctx, sp(255, 140, 190), cx, cy, br * (1.8 + S.mic * 1.5), (S.listen - 0.3) * 0.25 + S.mic * 0.3);
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
