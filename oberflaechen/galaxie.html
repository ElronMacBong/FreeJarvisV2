<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Galaxie</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 15 von 22 · GALAXIE */
  :root{--ac:#8f7bff;--ac-rgb:143,123,255;--bg:#03030a}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">galaxie · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Galaxie";
    J.on("state", s => { $("thState").textContent = "galaxie · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  const rnd = Math.random, gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  let cx = 0, cy = 0, R = 200, rot = 0;
  const st = [], bgs = [];
  J.registerTheme({
    id: "galaxie", maus: "wirbel",
    init(J) {
      cap(J);
      for (let i = 0; i < 2600; i++) {
        const bulge = i < 420, r = bulge ? Math.abs(gauss()) * 0.26 : 0.12 + Math.pow(rnd(), 0.75) * 1.15, arm = i % 2;
        const disc = !bulge && rnd() < 0.28;
        st.push({ r, a: bulge || disc ? rnd() * TAU : arm * Math.PI + 3.3 * Math.log(1 + 3.2 * r) + gauss() * (0.2 + 0.25 * r), z: gauss() * (bulge ? 0.16 : 0.035 + 0.03 * r), p: rnd() * TAU, s: 0.4 + rnd() * rnd() * 1.6,
          c: bulge ? 0 : disc ? 2 : rnd() < 0.08 ? 3 : r < 0.5 ? 1 : 2, dim: disc ? 0.55 : 1 });
      }
      for (let i = 0; i < 220; i++) bgs.push({ x: rnd(), y: rnd(), s: rnd(), p: rnd() * TAU });
    },
    resize(w, h) { cx = w / 2; cy = h * 0.46; R = Math.min(w * 0.3, h * 0.36); J.orbit = { x: cx, y: cy, r: R * 0.8 }; },
    draw(ctx, w, h, S) {
      const t = S.t, sp = J.sprite;
      rot += S.dt * (0.06 + S.think * 0.5 + S.speak * 0.1);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#130f2e"); bg.addColorStop(0.45, "#070616"); bg.addColorStop(1, "#020207");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      for (const s of bgs) { ctx.globalAlpha = 0.2 + 0.4 * Math.sin(t * (0.4 + s.s) + s.p) ** 2; ctx.fillStyle = "#fff"; ctx.fillRect(s.x * w, s.y * h, 1 + s.s, 1 + s.s); }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.pulse * 0.04), tilt = 0.98, ct = Math.cos(tilt), sn = Math.sin(tilt), roll = -0.32, cr = Math.cos(roll), sr = Math.sin(roll), F = 3.6;
      const SPR = [sp(255, 225, 180, true), sp(190, 170, 255, true), sp(120, 150, 255, true), sp(255, 120, 190, true)];
      J.glowAt(ctx, sp(110, 90, 255), cx, cy, br * 3.2, 0.3 + S.level * 0.2);
      const wave = (t * 0.35) % 1.3;
      for (const s of st) {
        const a = s.a + rot / (0.25 + s.r) * 0.9, x0 = Math.cos(a) * s.r, y0 = Math.sin(a) * s.r, z0 = s.z * (1 + S.level * 1.5);
        const y1 = y0 * ct - z0 * sn, z1 = y0 * sn + z0 * ct, k = F / (F + z1), X = x0 * cr - y1 * sr, Y = x0 * sr + y1 * cr;
        const hit = Math.max(0, 1 - Math.abs(s.r - wave) * 7) * (S.speak + S.think * 0.6), tw = 0.6 + 0.4 * Math.sin(t * (1 + s.s) + s.p);
        J.glowAt(ctx, SPR[s.c], cx + X * br * k, cy + Y * br * k, (2.2 + s.s * 2.6 + S.level * 2.5 + hit * 5) * k, (0.34 + 0.4 * tw) * (s.c ? 0.75 : 1) * s.dim + hit * 0.5 + S.level * 0.25);
      }
      const core = br * (0.2 + S.level * 0.22 + S.pulse * 0.08);
      J.glowAt(ctx, sp(255, 200, 150), cx, cy, core * 4.2, 0.6 + S.level * 0.25); J.glowAt(ctx, sp(255, 250, 235, true), cx, cy, core * 1.2, 1);
      if (S.listen > 0.3) J.glowAt(ctx, sp(170, 150, 255), cx, cy, br * (1.8 + S.mic * 1.6), (S.listen - 0.3) * 0.22 + S.mic * 0.3);
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
