<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Tesserakt</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 21 von 22 · TESSERAKT */
  :root{--ac:#7c8cff;--ac-rgb:124,140,255;--bg:#03040c}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">tesserakt · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Tesserakt";
    J.on("state", s => { $("thState").textContent = "tesserakt · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  const rnd = Math.random, gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  let cx = 0, cy = 0, R = 200, rot = 0;
  const V = [], E = [], dust = []; let r1 = 0, r2 = 0, r3 = 0;
  J.registerTheme({
    id: "tesserakt", maus: "abstossen",
    init(J) {
      cap(J);
      for (let i = 0; i < 16; i++) V.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1, i & 8 ? 1 : -1]);
      for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) { const j = i ^ (1 << b); if (i < j) E.push([i, j, b]); }
      for (let i = 0; i < 180; i++) dust.push({ x: gauss() * 2.2, y: gauss() * 1.6, z: gauss() * 2, p: rnd() * TAU });
    },
    resize(w, h) { cx = w / 2; cy = h * 0.46; R = Math.min(w * 0.125, h * 0.15); J.orbit = { x: cx, y: cy, r: R * 1.9 }; },
    draw(ctx, w, h, S) {
      const t = S.t, dt = S.dt, sp = J.sprite, k0 = 1 + S.think * 3 + S.speak * 0.6;
      r1 += dt * 0.42 * k0; r2 += dt * 0.27 * k0; r3 += dt * 0.19;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#111433"); bg.addColorStop(0.5, "#070818"); bg.addColorStop(1, "#020206");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.level * 0.1 + S.pulse * 0.05), c1 = Math.cos(r1), s1 = Math.sin(r1), c2 = Math.cos(r2), s2 = Math.sin(r2), c3 = Math.cos(r3), s3 = Math.sin(r3);
      const W4 = 3.1 - S.level * 0.5, F = 4.5;
      J.glowAt(ctx, sp(90, 100, 255), cx, cy, br * 4.6, 0.26 + S.level * 0.22);
      const sD = sp(170, 180, 255, true);
      for (const d of dust) { const x = d.x * c3 + d.z * s3, z = -d.x * s3 + d.z * c3, k = F / (F + z); J.glowAt(ctx, sD, cx + x * br * k, cy + d.y * br * k, 3 * k, 0.2 + 0.3 * Math.sin(t + d.p) ** 2); }
      const P = V.map(v => {
        let x = v[0], y = v[1], z = v[2], q = v[3];
        let a = x * c1 - q * s1; q = x * s1 + q * c1; x = a;            // Drehung in der Ebene x-w
        a = y * c2 - z * s2; z = y * s2 + z * c2; y = a;                // Drehung in der Ebene y-z
        a = z * c1 - q * s1 * 0.6; q = z * s1 * 0.6 + q * c1; z = a;    // Drehung in der Ebene z-w
        const k4 = W4 / (W4 + q * 0.9); x *= k4; y *= k4; z *= k4;      // 4D -> 3D
        a = x * c3 + z * s3; z = -x * s3 + z * c3; x = a;
        const k = F / (F + z); return [cx + x * br * k, cy + y * br * k, z, k4 * k];
      });
      const COL = ["140,150,255", "190,150,255", "120,200,255", "255,255,255"];
      for (const [i, j, b] of E) { const a = P[i], c = P[j], dep = (a[3] + c[3]) / 2;
        for (const wdt of [9, 3, 1.1]) { ctx.strokeStyle = `rgba(${wdt < 2 ? "235,238,255" : COL[b]},${(wdt > 5 ? 0.06 : wdt > 2 ? 0.26 : 0.8) * Math.min(1.4, dep) * (1 + S.level * 0.8) * (b === 3 ? 0.8 + 0.4 * Math.sin(t * 3) ** 2 : 1)})`; ctx.lineWidth = wdt * dep; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); } }
      const sV = sp(225, 230, 255, true);
      for (const p of P) J.glowAt(ctx, sV, p[0], p[1], (9 + S.level * 12) * p[3], 0.95);
      const core = br * (0.14 + S.level * 0.24 + S.pulse * 0.08);
      J.glowAt(ctx, sp(150, 160, 255), cx, cy, core * 4.4, 0.6); J.glowAt(ctx, sp(250, 250, 255, true), cx, cy, core * 1.2, 0.95);
      if (S.listen > 0.3) { ctx.strokeStyle = `rgba(190,200,255,${(S.listen - 0.3) * 0.4 + S.mic * 0.5})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, br * (2.6 + S.mic * 0.4), 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
