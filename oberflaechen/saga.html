<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Saga</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 8 von 22 · SAGA */
  :root{--ac:#ff3d6e;--ac-rgb:255,61,110;--bg:#0c0307}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">saga · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Saga";
    J.on("state", s => { $("thState").textContent = "saga · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  let cx = 0, cy = 0, R = 200, rot = 0;
  const fil = [], dust = [];
  J.registerTheme({
    id: "saga", maus: "wirbel",
    init(J) {
      cap(J);
      for (let i = 0; i < 64; i++) fil.push({ ax: Math.random() * TAU, ay: Math.random() * TAU, r: 0.35 + Math.pow(Math.random(), 0.8) * 0.75, e: 0.55 + Math.random() * 0.45, w: 2 + (Math.random() * 4 | 0), p: Math.random() * TAU, sp: (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.35), h: Math.random() });
      for (let i = 0; i < 520; i++) { const u = Math.random() * TAU, v = Math.acos(2 * Math.random() - 1), r = Math.pow(Math.random(), 1.7) * 1.05; dust.push({ x: Math.sin(v) * Math.cos(u) * r, y: Math.cos(v) * r * 0.9, z: Math.sin(v) * Math.sin(u) * r, p: Math.random() * TAU, s: 0.5 + Math.random() }); }
    },
    resize(w, h) { cx = w / 2; cy = h * 0.46; R = Math.min(w * 0.27, h * 0.31); J.orbit = { x: cx, y: cy, r: R }; },
    draw(ctx, w, h, S) {
      const t = S.t, sp = J.sprite;
      rot += S.dt * (0.12 + S.think * 0.9 + S.speak * 0.25);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#2a0713"); bg.addColorStop(0.45, "#12040a"); bg.addColorStop(1, "#060204");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.level * 0.16 + S.mic * 0.1 + S.pulse * 0.06), F = 3.2, cr = Math.cos(rot), sr = Math.sin(rot);
      J.glowAt(ctx, sp(255, 40, 90), cx, cy, br * (3.4 + S.level), 0.34 + S.level * 0.25);
      ctx.lineWidth = 1;
      for (const f of fil) {
        const ca = Math.cos(f.ax), sa = Math.sin(f.ax), cb = Math.cos(f.ay + t * f.sp * 0.3), sb = Math.sin(f.ay + t * f.sp * 0.3);
        ctx.beginPath();
        for (let i = 0; i <= 90; i++) {
          const u = i / 90 * TAU + t * f.sp;
          const rr = f.r * (1 + 0.16 * Math.sin(f.w * u + f.p + t * 0.7) + S.level * 0.2 * Math.sin(5 * u - t * 7 + f.p));
          let x = Math.cos(u) * rr, y = Math.sin(u) * rr * f.e, z = 0.12 * Math.sin(3 * u + f.p);
          const y1 = y * ca - z * sa, z1 = y * sa + z * ca, x2 = x * cb + z1 * sb, z2 = -x * sb + z1 * cb;
          const x3 = x2 * cr + z2 * sr, z3 = -x2 * sr + z2 * cr, k = F / (F + z3);
          i ? ctx.lineTo(cx + x3 * br * k, cy + y1 * br * k) : ctx.moveTo(cx + x3 * br * k, cy + y1 * br * k);
        }
        ctx.strokeStyle = `rgba(${f.h > 0.8 ? "255,190,205" : f.h > 0.4 ? "255,70,110" : "200,30,70"},${(0.09 + 0.1 * f.h) * (1 + S.level * 1.3 + S.pulse * 0.5)})`;
        ctx.stroke();
      }
      const s1 = sp(255, 90, 130), s2 = sp(255, 220, 230, true);
      for (const p of dust) {
        const a = rot * 1.4 + p.p * 0.02, x = p.x * Math.cos(a) - p.z * Math.sin(a), z = p.x * Math.sin(a) + p.z * Math.cos(a), k = F / (F + z);
        const tw = 0.5 + 0.5 * Math.sin(t * (1 + p.s) + p.p);
        J.glowAt(ctx, p.s > 1.3 ? s2 : s1, cx + x * br * k, cy + p.y * br * k, (3 + p.s * 4 + S.level * 5) * k, (0.2 + 0.5 * tw) * (0.6 + S.level * 0.8));
      }
      const core = br * (0.3 + S.level * 0.3 + S.pulse * 0.1);
      J.glowAt(ctx, sp(255, 120, 160), cx, cy, core * 3.2, 0.6 + S.level * 0.3);
      J.glowAt(ctx, sp(255, 240, 245, true), cx, cy, core * 1.1, 0.95);
      if (S.listen > 0.3) { ctx.strokeStyle = `rgba(255,160,185,${(S.listen - 0.3) * 0.5 + S.mic * 0.5})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, br * (1.25 + S.mic * 0.3), 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
