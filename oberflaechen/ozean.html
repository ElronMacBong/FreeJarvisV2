<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Ozean</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 20 von 22 · OZEAN */
  :root{--ac:#ff5fd0;--ac-rgb:255,95,208;--bg:#07030f}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">ozean · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Ozean";
    J.on("state", s => { $("thState").textContent = "ozean · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  const rnd = Math.random, gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  let cx = 0, cy = 0, R = 200, rot = 0;
  const COLS = 74, ROWS = 30, bgs = [];
  J.registerTheme({
    id: "ozean", maus: "abstossen",
    init(J) { cap(J); for (let i = 0; i < 150; i++) bgs.push({ x: rnd(), y: rnd() * 0.5, s: rnd(), p: rnd() * TAU }); },
    resize(w, h) { cx = w / 2; cy = h * 0.47; R = Math.min(w * 0.17, h * 0.23); J.orbit = { x: cx, y: cy - R * 0.25, r: R * 1.05 }; },
    draw(ctx, w, h, S) {
      const t = S.t, sp = J.sprite, hz = cy + R * 0.32;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, "#05020c"); bg.addColorStop(hz / h * 0.75, "#1a0730"); bg.addColorStop(hz / h, "#3a0e45"); bg.addColorStop(hz / h + 0.001, "#0c0418"); bg.addColorStop(1, "#04020a");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      for (const s of bgs) { ctx.globalAlpha = 0.2 + 0.4 * Math.sin(t * (0.4 + s.s) + s.p) ** 2; ctx.fillStyle = "#fff"; ctx.fillRect(s.x * w, s.y * h, 1 + s.s, 1 + s.s); }
      ctx.globalAlpha = 1;
      // Sonne mit Streifen
      const sr = R * (1 + S.level * 0.08 + S.pulse * 0.04), sy = cy - R * 0.25;
      ctx.globalCompositeOperation = "lighter"; J.glowAt(ctx, sp(255, 70, 190), cx, sy, sr * 5, 0.4 + S.level * 0.3); ctx.globalCompositeOperation = "source-over";
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, hz); ctx.clip(); ctx.beginPath(); ctx.arc(cx, sy, sr, 0, TAU); ctx.clip();
      const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr); sg.addColorStop(0, "#ffe27a"); sg.addColorStop(0.45, "#ff7ab8"); sg.addColorStop(1, "#b43cff");
      ctx.fillStyle = sg; ctx.fillRect(cx - sr, sy - sr, sr * 2, sr * 2);
      ctx.fillStyle = "#1c0730"; for (let i = 0; i < 7; i++) { const yy = sy + sr * (0.08 + i * 0.14) + ((t * 6) % (sr * 0.14)), hh = 1.5 + i * 1.5 * (1 + S.level); ctx.fillRect(cx - sr, yy, sr * 2, hh); }
      ctx.restore();
      // Meer aus Lichtpunkten
      ctx.globalCompositeOperation = "lighter";
      const sN = sp(255, 110, 215, true), sF = sp(110, 215, 255, true), dep = h - hz;
      for (let r = 0; r < ROWS; r++) {
        const v = r / (ROWS - 1), zz = Math.pow(v, 2.1), y0 = hz + zz * dep * 1.02, sc = 0.16 + zz * 1.25;
        ctx.beginPath(); let started = false;
        for (let c = 0; c < COLS; c++) {
          const u = c / (COLS - 1) - 0.5, wx = u * 9, wz = (1 - v) * 9;
          const wave = Math.sin(wx * 1.3 + t * 1.1 + wz * 0.6) * 0.5 + Math.sin(wz * 1.7 - t * 1.6) * 0.35 + Math.sin(wx * 2.9 - wz * 1.1 + t * 2.3) * 0.2;
          const amp = (7 + S.level * 34 * Math.exp(-u * u * 9) + S.mic * 18) * sc;
          const x = cx + u * w * 1.9 * sc, y = y0 - wave * amp;
          if (x < -20 || x > w + 20) continue;
          started ? ctx.lineTo(x, y) : ctx.moveTo(x, y); started = true;
          J.glowAt(ctx, v > 0.55 ? sN : sF, x, y, (2 + sc * 5) * (1 + S.level * 0.6), 0.3 + 0.5 * v + 0.3 * Math.max(0, wave));
        }
        ctx.strokeStyle = v > 0.55 ? `rgba(255,95,208,${0.08 + v * 0.16})` : `rgba(95,214,255,${0.07 + v * 0.14})`; ctx.lineWidth = 1; ctx.stroke();
      }
      J.glowAt(ctx, sp(255, 150, 220), cx, hz, w * 0.9, 0.16 + S.level * 0.14);   // Spiegelung am Horizont
      if (S.listen > 0.3) { ctx.strokeStyle = `rgba(255,170,230,${(S.listen - 0.3) * 0.4 + S.mic * 0.5})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, sy, sr * (1.2 + S.mic * 0.3), Math.PI, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
