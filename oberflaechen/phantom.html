<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Phantom</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 25 · PHANTOM */
  :root{--ac:#7fd4ff;--ac-rgb:127,212,255;--bg:#02050c}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">avatar · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Phantom";
    J.on("state", s => { $("thState").textContent = "phantom · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  const rnd = Math.random, gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  let cx = 0, cy = 0, R = 200;
  /* Gesichtslose Figur: Kopf, Hals und Schultern nur aus weichen Sternpunkten.
     Keine Augen, Nase oder Mund. Der Umriss leuchtet (Randlicht), das Innere ist ein dichter, dunkler Schatten aus Punkten.
     y zeigt nach unten, z < 0 zeigt zum Betrachter. */
  const P = [], bgs = []; let form = 0, mx = 0, my = 0;
  /* Männlicher Bau: breiter Schädel, kantiger Kiefer, kräftiger Hals, breite Schultern.
     ax = halbe Breite, cz = halbe Tiefe, pf = Seitenprofil (runde Stirn, voller Kiefer).
     eck = Form des Querschnitts: 2 ist ein Kreis, höhere Werte werden eckig (gibt die Kieferkante). */
  const ax = y => 0.72 * (1 - 0.2 * Math.pow(Math.max(0, y), 1.7)), cz = y => 0.86 * (1 - 0.08 * Math.max(0, y));
  const pf = y => Math.pow(Math.max(0, 1 - Math.pow(Math.abs(y), y < 0 ? 2.4 : 4.2)), 1 / (y < 0 ? 2.4 : 4.2));
  const HY = 0.84;                                          // Kopf gestaucht: breiter als hoch wirkt männlicher
  const eck = y => 2 + 0.95 * Math.max(0, Math.min(1, (y + 0.05) / 0.6));
  const kant = (v, e) => (v < 0 ? -1 : 1) * Math.pow(Math.abs(v), 2 / e);
  const add = (x, y, z, k, nx, ny, nz, drin) => P.push({ x, y, z, k, nx, ny, nz, in: !!drin, sx: (rnd() - 0.5) * 7, sy: (rnd() - 0.5) * 4.4, sz: (rnd() - 0.5) * 5, d: rnd(), p: rnd() * TAU, s: 0.5 + rnd(), v: rnd() });
  function build() {
    const NS = 2000, NV = 2700;
    for (let i = 0; i < NS; i++) {                          // Kopf: Oberfläche (bildet den leuchtenden Rand)
      const y = 1 - 2 * (i + 0.5) / NS, ph = i * 2.399963, rr = Math.sqrt(1 - y * y);
      const e = eck(y), ux = kant(Math.cos(ph), e) * rr, uz = kant(Math.sin(ph), e) * rr;
      if (y > 0.88 && uz > -0.35) continue;                 // Halsansatz frei lassen
      const sc = pf(y) / (rr || 1);
      add(ax(y) * ux * sc, y * HY, cz(y) * uz * sc, 0, ux, y, uz, false);
    }
    for (let i = 0; i < NV; i++) {                          // Kopf: Volumen (der gefüllte Schatten)
      const u = [gauss(), gauss(), gauss()], l = Math.hypot(u[0], u[1], u[2]) || 1, r = Math.pow(rnd(), 0.45);
      const ux = u[0] / l, uy = u[1] / l, uz = u[2] / l, yy = uy * r;
      if (uy > 0.84 && uz > -0.2) continue;
      const e = eck(yy), sc = pf(yy) / Math.sqrt(Math.max(1e-6, 1 - yy * yy));
      add(ax(yy) * kant(ux, e) * r * sc, yy * HY, cz(yy) * kant(uz, e) * r * sc, 0, ux, uy, uz, r < 0.93);
    }
    for (let i = 0; i < 1300; i++) {                        // Hals: kräftig, nach unten breiter (Nacken und Trapezmuskel)
      const a = rnd() * TAU, d = Math.sqrt(rnd()), y = 0.86 + rnd() * 0.72, br = 0.4 + Math.pow(Math.max(0, y - 0.86), 1.6) * 0.5;
      const e = 2.4, ux = kant(Math.cos(a), e), uz = kant(Math.sin(a), e);
      add(ux * br * d, y, uz * br * 0.88 * d + 0.08, 1, ux, 0, uz, d < 0.86);
    }
    for (let i = 0; i < 2000; i++) {                        // Schultern: breit und gerade
      const u = rnd() * 2 - 1, w = Math.abs(u), a = rnd() * Math.PI, top = 1.44 + 0.3 * Math.pow(w, 4);
      const tz = Math.cos(a) * 0.4 * (1 - w * 0.4) * Math.sqrt(rnd()) + 0.08;
      add(u * 1.62, top + rnd() * 0.44 * (1 - w * 0.25), tz, 1, 0, -1, -0.3, rnd() < 0.55);
    }
  }
  const nachbau = () => { P.length = 0; build(); };
  J.registerTheme({
    id: "phantom", maus: "aus",                       // der Kopf folgt der Maus schon selbst
    init(J) {
      cap(J); nachbau();
      for (let i = 0; i < 160; i++) bgs.push({ x: rnd(), y: rnd(), s: rnd(), p: rnd() * TAU });
      addEventListener("pointermove", e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });
    },
    resize(w, h) { cx = w / 2; cy = h * 0.38; R = Math.min(w * 0.18, h * 0.235); J.orbit = { x: cx, y: cy, r: R * 1.05 }; },
    draw(ctx, w, h, S) {
      const t = S.t, dt = S.dt, sp = J.sprite;
      form = Math.min(1, form + dt * (J.started ? 0.38 : -0.6)); if (form < 0) form = 0;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#0a1a30"); bg.addColorStop(0.5, "#040b18"); bg.addColorStop(1, "#010308");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      for (const s of bgs) { ctx.globalAlpha = 0.15 + 0.35 * Math.sin(t * (0.4 + s.s) + s.p) ** 2; ctx.fillStyle = "#fff"; ctx.fillRect(s.x * w, s.y * h, 1 + s.s, 1 + s.s); }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.pulse * 0.02 + S.level * 0.012), F = 4.2;
      const yaw = Math.sin(t * 0.33) * 0.3 + mx * 0.7 + S.think * Math.sin(t * 0.9) * 0.25, pit = Math.sin(t * 0.27) * 0.06 + my * 0.35 - S.listen * 0.05;
      const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pit), spn = Math.sin(pit);
      J.glowAt(ctx, sp(60, 150, 255), cx, cy, br * 4.6, 0.16 + S.level * 0.14);
      const SOFT = [sp(95, 150, 235), sp(190, 220, 255)];           // weiche, unscharfe Sterne (ohne harten Kern)
      const jit = S.think * 0.03, wave = (t * 0.45) % 2.4 - 0.5;    // beim Sprechen läuft ein Lichtband über die Figur
      for (const q of P) {
        let x = q.x, y = q.y, z = q.z;
        if (jit) { x += Math.sin(t * 9 + q.p) * jit; y += Math.cos(t * 8 + q.p * 1.3) * jit; }
        const hd = q.k !== 1, yw = hd ? 1 : 0.25, c1 = hd ? cyw : Math.cos(yaw * yw), s1 = hd ? syw : Math.sin(yaw * yw);
        let x1 = x * c1 - z * s1, z1 = x * s1 + z * c1, y1 = y, z2 = z1;
        if (hd) { y1 = y * cp - z1 * spn; z2 = y * spn + z1 * cp; }
        const nz = q.k === 0 ? q.nx * s1 + q.nz * c1 : q.nz;           // Blickrichtung der Oberfläche (für das Randlicht)
        const rim = q.k === 0 ? Math.pow(1 - Math.min(1, Math.abs(nz)), 2.2) : 0.35;
        const f = Math.max(0, Math.min(1, form * 1.9 - q.d * 0.9)), e = f * f * (3 - 2 * f);
        const X = q.sx + (x1 - q.sx) * e, Y = q.sy + (y1 - q.sy) * e, Z = q.sz + (z2 - q.sz) * e, k = F / (F + Z);
        const tw = 0.7 + 0.3 * Math.sin(t * (1.3 + q.s) + q.p);
        const band = S.speak > 0.05 ? Math.max(0, 1 - Math.abs(Y - wave) * 2.2) * (S.speak * 0.5 + S.level * 0.5) : 0;
        const inner = q.in;                                                    // Volumenpunkt (Schatten) oder Rand
        const al = (inner ? 0.07 + 0.05 * q.v : 0.1 + rim * 0.5) + band * 0.35 + S.level * 0.05;
        const depth = z2 > 0 ? 0.55 : 1;
        J.glowAt(ctx, SOFT[rim > 0.55 || band > 0.4 ? 1 : 0], cx + X * br * k, cy + Y * br * k,
          (inner ? 9 + q.s * 7 : 6 + q.s * 5 + rim * 3) * k * (1 + (1 - e) * 0.6), (al * depth * e + (1 - e) * 0.4) * tw);
      }
      if (S.listen > 0.3) { ctx.strokeStyle = `rgba(150,215,255,${(S.listen - 0.3) * 0.3 + S.mic * 0.4})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, br * (0.95 + S.mic * 0.15), br * (1.22 + S.mic * 0.15), 0, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
