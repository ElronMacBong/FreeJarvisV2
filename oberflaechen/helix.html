<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Helix</title>
<link rel="stylesheet" href="/core/core.css">
<style>
  /* Oberfläche 12 von 22 · HELIX */
  :root{--ac:#ffc93c;--ac-rgb:255,201,60;--bg:#0b0802}
  #th-cap{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #th-cap h1{margin:0;font-size:12px;letter-spacing:.42em;font-weight:600;color:rgba(255,255,255,.88);padding-left:.42em}
  #th-cap p{margin:6px 0 0;font-size:11px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="th-cap"><h1 id="thName">JARVIS</h1><p id="thState">helix · bereit</p></div>
<script src="/core/core.js"></script>
<script>
(function () {
  const J = window.Jarvis, $ = id => document.getElementById(id), TAU = Math.PI * 2;
  const cap = J => { const nm = (J.settings.name || "Jarvis").toUpperCase(); $("thName").textContent = nm; document.title = nm + " · Helix";
    J.on("state", s => { $("thState").textContent = "helix · " + { idle: "bereit", listening: "hört zu", thinking: "denkt nach", speaking: "spricht" }[s]; }); };
  let cx = 0, cy = 0, R = 200, rot = 0;
  const N = 150, sparks = [];
  J.registerTheme({
    id: "helix", maus: "wirbel",
    init(J) { cap(J); for (let i = 0; i < 160; i++) sparks.push({ u: Math.random() * 2 - 1, a: Math.random() * TAU, r: 0.5 + Math.random() * 0.9, p: Math.random() * TAU, s: 0.2 + Math.random() * 0.6 }); },
    resize(w, h) { cx = w / 2; cy = h * 0.47; R = Math.min(w * 0.24, h * 0.27); J.orbit = { x: cx, y: cy, r: R }; },
    draw(ctx, w, h, S) {
      const t = S.t, sp = J.sprite;
      rot += S.dt * (0.5 + S.think * 2.4 + S.speak * 0.8);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
      bg.addColorStop(0, "#2a1c05"); bg.addColorStop(0.5, "#120c03"); bg.addColorStop(1, "#060401");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      const br = R * (1 + S.pulse * 0.05), F = 3.4, tilt = 0.3, ct = Math.cos(tilt), st = Math.sin(tilt), TURNS = 2.6;
      J.glowAt(ctx, sp(255, 170, 30), cx, cy, br * 3.4, 0.28 + S.level * 0.22);
      const P = (u, ang, rad) => { const x0 = Math.cos(ang) * rad, z0 = Math.sin(ang) * rad, y0 = u * 1.02, y = y0 * ct - z0 * st, z = y0 * st + z0 * ct, k = F / (F + z); return [cx + x0 * br * k, cy + y * br * k, z, k]; };
      const rad = u => (0.2 + 0.78 * u * u) * (1 + S.level * 0.2 * Math.sin(u * 9 - t * 8) + S.mic * 0.1);
      const sA = sp(255, 200, 70, true), sB = sp(255, 245, 210, true);
      const strand = [[], []];
      for (let i = 0; i <= N; i++) { const u = i / N * 2 - 1, a = u * TURNS * Math.PI + rot; strand[0].push(P(u, a, rad(u))); strand[1].push(P(u, a + Math.PI, rad(u))); }
      ctx.lineWidth = 1;
      for (let i = 0; i <= N; i += 3) {   // Sprossen
        const a = strand[0][i], b = strand[1][i], al = 0.1 + 0.16 * (0.5 + 0.5 * Math.sin(i * 0.4 - t * 3)) + S.level * 0.25;
        ctx.strokeStyle = `rgba(255,205,90,${al})`; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      strand.forEach((s, si) => {
        for (const wdt of [9, 3.2, 1.2]) { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
          ctx.strokeStyle = wdt > 5 ? `rgba(255,170,30,${0.07 + S.level * 0.08})` : wdt > 2 ? `rgba(255,200,70,${0.32 + S.level * 0.3})` : `rgba(255,250,225,${0.75})`; ctx.lineWidth = wdt; ctx.stroke(); }
        for (let i = 0; i <= N; i += 5) { const p = s[i]; J.glowAt(ctx, si ? sB : sA, p[0], p[1], (5 + S.level * 8) * p[3] * (p[2] < 0 ? 1.2 : 0.7), p[2] < 0 ? 0.85 : 0.3); }
      });
      for (const q of sparks) {
        const u = ((q.u + t * q.s * 0.12 + 1) % 2) - 1, p = P(u, q.a + rot * 0.4, rad(u) * q.r + 0.25);
        J.glowAt(ctx, sA, p[0], p[1], 3.5 * p[3], (0.2 + 0.4 * (0.5 + 0.5 * Math.sin(t * 2 + q.p))) * (1 - Math.abs(u)));
      }
      const core = br * (0.24 + S.level * 0.3 + S.pulse * 0.1);
      J.glowAt(ctx, sp(255, 190, 60), cx, cy, core * 3.6, 0.75); J.glowAt(ctx, sp(255, 252, 235, true), cx, cy, core * 1.2, 1);
      if (S.listen > 0.3) J.glowAt(ctx, sp(255, 215, 110), cx, cy, br * (1.6 + S.mic * 1.6), (S.listen - 0.3) * 0.25 + S.mic * 0.3);
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
</body>
</html>
